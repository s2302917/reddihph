name: reddiph
description: Reddiph Emergency Coordination Portal
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^14.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  # pdf 3.12.0 allows archive <4.1.0, incompatible with image 4.11.0.
  image: 4.10.1

flutter:
  uses-material-design: true
  assets:
    - lib/assests/logo.png
